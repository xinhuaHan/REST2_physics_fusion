project:
  seed: 42

dataset:
  name: YLJ
  parquet_file: /data/PVMMoE/DATA/01-Solar/YLJ/Benchmark/YLJ-Unified_format-with_DNI_DHI.parquet
  timestamp_column: timestamp
  target_column: observe_power
  serial_columns:
    - observe_power
    - observe_ghi-onsite
    - TEMP-NWP_observe
    - WS-NWP_observe
    - WD-NWP_observe
    - PREC-NWP_observe
    - PWAT-NWP_observe
    - SDWE-NWP_observe
    - GHI-NWP_forecast_1day
    - TEMP-NWP_forecast_1day
    - WS-NWP_forecast_1day
    - WD-NWP_forecast_1day
    - PREC-NWP_forecast_1day
    - PWAT-NWP_forecast_1day
    - SDWE-NWP_forecast_1day
    - GHI-NWP_forecast_4hour
    - TEMP-NWP_forecast_4hour
    - WS-NWP_forecast_4hour
    - WD-NWP_forecast_4hour
    - PREC-NWP_forecast_4hour
    - PWAT-NWP_forecast_4hour
    - SDWE-NWP_forecast_4hour
  irradiance_columns: {ghi: observe_ghi-onsite, dni: estimated_DNI-onsite, dhi: estimated_DHI-onsite}
  irradiance_sources: {ghi: observed, dni: estimated, dhi: estimated}
  target_floor: 0.0  # physically non-negative MW; NaN targets are never filled
  sampling_interval_minutes: 15
  history_points: 16
  forecast_step_minutes: 15
  forecast_steps: 16
  forecast_horizon_minutes: 240
  causal_fill: forward_fill
  pressure_column: null
  pressure_unit: pa
  wind_columns: [WS-NWP_forecast_4hour]
  precip_column: PREC-NWP_forecast_4hour
  pwv_column: PWAT-NWP_observe
  pwv_unit: mm
  pwv_to_cm: 0.1  # source PWAT is millimetres; REST2 expects centimetres

site:
  longitude: 100.641
  latitude: 29.919
  altitude_m: 4300.0
  timezone: Asia/Shanghai

physics_defaults: {pressure_pa: 101325.0, pwv_cm: 1.5, aod700: 0.08, precip: 0.0}

images:
  enabled: false
  root: null
  paths_column: null
  timestamps_column: null
  max_frames: 16
  channels: 3
  size: 64
  sampling_strategy: uniform
  reject_future: true
  history_minutes: 75

normalization:
  power_scale: 468.0
  rated_power: 468.0

evaluation:
  horizons_minutes: [15, 240]
  nrmse_denominator: 468.0
  hard_delta_fraction: 0.10
  direction_min_delta_fraction: 0.02

splits:
  development: ["2024-01-01 00:00:00", "2025-01-01 00:00:00"]
  validation_fraction: 0.15
  test: ["2025-01-01 00:00:00", "2025-06-01 00:00:00"]

# REST2 vectors currently include physical Pa-scale values (for example pressure
# around 101325).  Keep this unnormalised adapter in FP32 to prevent FP16 input
# overflow before the physics encoder.  DDP remains enabled on all eight GPUs.
runtime: {distributed: true, gpu_devices: "0,1,2,3,4,5,6,7", precision: fp32, num_workers: 4, pin_memory: true}

model:
  physics_input_dim: 26
  hidden_size: 768
  serial_layers: 2
  fusion_heads: 8
  moe_layers: 4
  moe_heads: 8
  num_experts: 8
  num_shared_experts: 2
  top_k_experts: 2
  pcd_hidden_size: 128
  pcd_layers: 2
  target_mode: power
  dropout: 0.1
  raw_state_residual_scale: 500.0
  night_cos_threshold: 0.0

training:
  batch_size: 16
  epochs: 50
  learning_rate: 0.0003
  weight_decay: 0.00001
  task_loss_weight: 1.0
  irradiance_loss_weight: 0.2
  moe_balance_weight: 0.01
  raw_correction_weight: 0.000001
  gradient_clip: 1.0
  num_workers: 4
  device: cuda
  output_dir: outputs/ylj_parquet
