project:
  seed: 42
data:
  forecast_lead_minutes: [15]
model:
  serial_input_dim: 13
  physics_input_dim: 26
  # Optional asynchronous sky-image modality. Keep false for datasets without images.
  use_image: false
  image_channels: 3
  image_size: 64
  image_cnn_width: 32
  image_temporal_layers: 1
  image_temporal_heads: 8
  image_time_scale_minutes: 5.0
  hidden_size: 768
  serial_layers: 2
  fusion_heads: 8
  moe_layers: 4
  moe_heads: 8
  num_experts: 8
  num_shared_experts: 2
  top_k_experts: 2
  pcd_hidden_size: 128
  pcd_layers: 2
  forecast_horizon: 1
  target_mode: power
  dropout: 0.1
  raw_state_residual_scale: 500.0
  night_cos_threshold: 0.0
training:
  batch_size: 16
  epochs: 50
  learning_rate: 0.0003
  weight_decay: 0.00001
  task_loss_weight: 1.0
  irradiance_loss_weight: 0.2
  moe_balance_weight: 0.01
  raw_correction_weight: 0.000001
  gradient_clip: 1.0
  num_workers: 0
  device: cpu
  output_dir: outputs/default
